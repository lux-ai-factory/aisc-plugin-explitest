[project]
name = "explitest-plugin"
version = "0.2.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammed Fellaji", email = "fellajimohammed@gmail.com" },
    { name = "Yu-Lin Huang", email = "yu-lin.huang@uni.lu" },
    { name = "Kaouther Benguessoum", email = "kaouther.benguessoum@uni.lu"},
    { name = "Raoni Lourenco", email = "raoni.lourenco@uni.lu" },
     
]
requires-python = ">=3.12"
dependencies = [
    "aisc-plugin-interface>=0.2.5",
    "explitest",
    "lime>=0.2.0.1",
    "numpy>=2.4.2",
    "onnxruntime>=1.24.4,<1.26",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.0",
    "shap>=0.49.1",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
explitest = { git = "https://github.com/serval-uni-lu/ExpliTest.git", rev = "0b890752307845f524b616e43f9febf7017391c8" }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.11",
    "ty>=0.0.32",
]
